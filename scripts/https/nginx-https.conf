# 작성자: 김진우 — TLS를 종료하고 개발 서버의 공개 API와 Swagger를 전달한다.
user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 80 default_server;
        server_name 13.125.12.94;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }
        # HTTP에서는 인증 토큰이나 요청 본문을 백엔드에 전달하지 않는다.
        location / { return 404; }
    }
    server {
        listen 443 ssl default_server;
        server_name 13.125.12.94;
        ssl_certificate /etc/letsencrypt/live/heapy-ip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/heapy-ip/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        # 파일 제한 20MB에 multipart 부가 정보를 위한 여유를 둔다.
        client_max_body_size 21m;
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host 13.125.12.94;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
        # 개발 서버에서 Swagger 화면과 OpenAPI 문서를 조회한다.
        location ~ ^/(swagger-ui(/|\.html$)|v3/api-docs(/|$)) {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host 13.125.12.94;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        # 관리·내부 경로는 외부에 공개하지 않는다.
        location / { return 404; }
    }
}
