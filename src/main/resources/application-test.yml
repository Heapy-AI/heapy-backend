spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:heapy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

heapy:
  supabase:
    url: http://localhost:54321
    anon-key: test-anon-key

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
