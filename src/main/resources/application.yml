spring:
  application:
    name: heapy-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:http://localhost:54321/auth/v1}
          jwk-set-uri: ${SUPABASE_JWK_SET_URI:http://localhost:54321/auth/v1/.well-known/jwks.json}
          audiences: ${SUPABASE_JWT_AUDIENCE:authenticated}

heapy:
  supabase:
    url: ${SUPABASE_URL:http://localhost:54321}
    anon-key: ${SUPABASE_ANON_KEY:local-anon-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info
