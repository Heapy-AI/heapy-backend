spring:
  servlet:
    multipart:
      max-file-size: 20000000B
      max-request-size: 21000000B
  application:
    name: heapy-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:http://localhost:54321/auth/v1}
          jwk-set-uri: ${SUPABASE_JWK_SET_URI:http://localhost:54321/auth/v1/.well-known/jwks.json}
          audiences: ${SUPABASE_JWT_AUDIENCE:authenticated}
          jws-algorithms: ES256

heapy:
  ocr:
    enabled: ${OCR_ENABLED:true}
    region: ${OCR_REGION:ap-northeast-2}
    account-id: ${OCR_ACCOUNT_ID:577638373354}
    bucket: ${OCR_BUCKET:heapy-ocr-dev-runtime-bucket-gaxs20bnat6n}
    worker-arn: ${OCR_WORKER_ARN:arn:aws:lambda:ap-northeast-2:577638373354:function:heapy-ocr-dev-runtime-Worker-BRv8BzBzvAaB:live}
  supabase:
    url: ${SUPABASE_URL:http://localhost:54321}
    anon-key: ${SUPABASE_ANON_KEY:local-anon-key}
    signup-redirect-url: ${SUPABASE_SIGNUP_REDIRECT_URL:heapy://auth/callback}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
